# Google 캘린더 등록 현황
#
# data/ddays.yaml 이 정본이고, 이 파일은 "그 정본이 캘린더의 어느 일정에 반영돼 있는지" 를 적어둔 것이다.
# 기념일을 고쳤으면 여기 적힌 event_id 를 update 하면 된다. 새로 만들면 중복이 생긴다.

calendar_id: nayoonghee78@gmail.com     # 기본 캘린더
registered_on: 2026-08-31
reminders: [당일 09:00, 1주 전 09:00]     # overrideReminders: popup -540, popup 9540

# 음력 4건: 매년 양력 날짜가 달라 RRULE 로 표현할 수 없다.
# 한 일정에 RDATE 로 발생일을 나열해 두었다. 아래 through 연도가 지나기 전에 갱신해야 한다.
